# The orbit-drives target fragment. Include it into an orbit project
# configuration to add the ghdl and nvc targets:
#
#   orbit config --push include=/path/to/orbit-drives/config.toml
#
# The `orbit-drives` binary must be on PATH (`cargo install --path .`).
# Run them through orbit:
#
#   orbit test --target ghdl -- -gW=4 --vcd=waves.vcd
#   orbit test --target nvc
#   orbit test --target iverilog
#
#   iverilog waves have no flag: vvp ignores a `-vcd=` extra (probed:
#   exit 0, no file written), so the testbench itself must call
#   `$dumpfile("waves.vcd")` and `$dumpvars(0, tb)` -- vvp then writes
#   the waves into the drive's working directory.
#   orbit build --target ghdl-build -- --top gate
#   orbit build --target nvc-build -- --top gate
#   orbit build --target verilator-build -- --top gate
#   orbit build --target yosys -- --top top
#   orbit build --target vivado-build -- --part xc7z010clg400-1 --top top
#
# The vivado targets need the install path on $VIVADO_BIN (the drive
# derives the launch recipe env -- LOCPATH / LC_ALL / LD_LIBRARY_PATH --
# from it and its own defaults; see the README's launch-recipe section).
# The vivado sim face consumes no --part.
#
# No --top is needed for the sim faces through `orbit test`: the drive
# runs the testbench orbit exports as $ORBIT_TB_NAME (through `orbit
# build`, pass -- --top <name>). Everything after orbit's `--` rides the
# drive's last tool argv verbatim: the `ghdl -r` / `nvc -r` / `vvp` argv
# on the sim faces, the `ghdl -e` / `nvc -e` / `iverilog` compile /
# verilator build argv on the build faces.

[[target]]
name = "ghdl"
description = "VHDL testbenches through ghdl: blueprint-order analysis with the deferral loop, each run gated on ghdl's probed failure vocabulary and the honest exit"
command = ["orbit-drives", "ghdl"]

[[target]]
name = "ghdl-build"
description = "VHDL builds through ghdl: blueprint-order analysis with the deferral loop, then elaboration per top -- exit honest, no simulation, nothing judged"
command = ["orbit-drives", "ghdl-build"]

[[target]]
name = "nvc"
description = "VHDL testbenches through nvc: blueprint-order analysis with the deferral loop, each run gated on nvc's probed failure vocabulary and the honest exit"
command = ["orbit-drives", "nvc"]

[[target]]
name = "nvc-build"
description = "VHDL builds through nvc: blueprint-order analysis with the deferral loop, then elaboration per top -- exit honest, no simulation, nothing judged"
command = ["orbit-drives", "nvc-build"]

[[target]]
name = "iverilog"
description = "Verilog/SV testbenches through Icarus Verilog: one order-free compile into a snapshot (-g2012, every --top a -s root), then one judged vvp run -- vvp exits 0 on a $error call, so the probed vocabulary is the load-bearing gate"
command = ["orbit-drives", "iverilog"]

[[target]]
name = "iverilog-build"
description = "Verilog/SV builds through Icarus Verilog: the one order-free compile into a snapshot, exit honest -- no simulation, nothing judged; every --top a -s root, validated by iverilog at compile time"
command = ["orbit-drives", "iverilog-build"]

[[target]]
name = "verilator"
description = "Verilog/SV testbenches through verilator: one lint (--timing; every --top a --top-module, of which verilator honors only the last), one model build per top (--binary --build into obj_dir; each build validates its top), each model run gated on verilator's probed failure vocabulary and the model's exit -- every probed model failure dies by SIGABRT"
command = ["orbit-drives", "verilator"]

[[target]]
name = "verilator-build"
description = "Verilog/SV builds through verilator: the lint and the per-top model builds only, exit honest -- no simulation, nothing judged; the lint honors only the last --top-module (an unknown non-last top lints clean), and the lint and build exits are honest (exit 1 on a lint error, an unknown top's own build, or an enabled warning)"
command = ["orbit-drives", "verilator-build"]

[[target]]
name = "yosys"
description = "Verilog/SV synthesis through yosys: one script-driven `yosys -p` per top (read every blueprint Verilog file, synth -top, write netlists/<top>.v), the log judged on yosys's probed ERROR: vocabulary AND yosys's exit -- every probed failure exits 1, so the exit convicts and the judge is the second witness. Build only: yosys has no runtime, there is no sim face"
command = ["orbit-drives", "yosys"]

[[target]]
name = "vivado-build"
description = "VHDL and Verilog/SV synthesis through Vivado: xvhdl compiles the VHDL in blueprint order through the deferral loop (order-sensitive within work, probed), one order-free xvlog compiles the Verilog, then per top the GENERATED synthesis script rides `vivado -mode batch -nojournal -nolog` -- one read per file, synth_design -top -part -mode out_of_context, three netlist writers into netlists/, the whole body inside one return-code catch-guard (Tcl's catch returns the writers' filename results, so an emptiness guard would false-fail a clean synth -- probed). Requires --part BEFORE any drive (exit 2 at the CLI); needs the launch recipe env, which the drive sets on every spawn (see the README)"
command = ["orbit-drives", "vivado-build"]

[[target]]
name = "vivado"
description = "VHDL and Verilog/SV testbenches through Vivado xsim: the same both-language compile, then xelab per top (-L work work.<top> -s <top>) and one xsim -R per snapshot, every run log gated on vivado's probed LINE-START failure vocabulary (Failure:/Error:/Fatal: at line start; case drift and mid-line markers never judge) -- xsim exits 0 on BOTH probed runtime failures (a severity failure AND a severity error), so the judge is the load-bearing gate; the sim face consumes no --part"
command = ["orbit-drives", "vivado"]
