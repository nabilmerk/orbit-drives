# The orbit-contracts target fragment. Include it into an orbit project
# configuration to add the ghdl and nvc targets:
#
#   orbit config --push include=/path/to/orbit-contracts/config.toml
#
# The `orbit-contracts` binary must be on PATH (`cargo install --path .`).
# Run them through orbit:
#
#   orbit test --target ghdl -- -gWIDTH=8 --vcd=waves.vcd
#   orbit test --target nvc
#   orbit build --target ghdl-build -- --top gate
#   orbit build --target nvc-build -- --top gate
#
# No --top is needed for the sim faces through `orbit test`: the drive
# runs the testbench orbit exports as $ORBIT_TB_NAME (through `orbit
# build`, pass -- --top <name>). Everything after orbit's `--` rides the
# drive's last tool argv verbatim: the `ghdl -r` / `nvc -r` argv on the
# sim faces, the `ghdl -e` / `nvc -e` argv on the build faces.

[[target]]
name = "ghdl"
description = "VHDL testbenches through ghdl: blueprint-order analysis with the deferral loop, each run gated on ghdl's probed failure vocabulary and the honest exit"
command = ["orbit-contracts", "ghdl"]

[[target]]
name = "ghdl-build"
description = "VHDL builds through ghdl: blueprint-order analysis with the deferral loop, then elaboration per top -- exit honest, no simulation, nothing judged"
command = ["orbit-contracts", "ghdl-build"]

[[target]]
name = "nvc"
description = "VHDL testbenches through nvc: blueprint-order analysis with the deferral loop, each run gated on nvc's probed failure vocabulary and the honest exit"
command = ["orbit-contracts", "nvc"]

[[target]]
name = "nvc-build"
description = "VHDL builds through nvc: blueprint-order analysis with the deferral loop, then elaboration per top -- exit honest, no simulation, nothing judged"
command = ["orbit-contracts", "nvc-build"]
